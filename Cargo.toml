[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
shiyin-core = { path = "crates/core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "stream", "http2", "charset"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
tracing = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
