name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: 安装前端依赖与构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 初始化 Android 包装
        working-directory: src-tauri
        run: |
          ../web/node_modules/.bin/tauri android init --ci --skip-targets-install

      - name: 构建 Android APK (arm64-v8a)
        working-directory: src-tauri
        run: |
          ../web/node_modules/.bin/tauri android build --apk --target aarch64-linux-android

      - name: 收集 APK 文件
        run: |
          mkdir -p output-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} output-apk/ \;
          ls -lh output-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: shiyin-android-apk
          path: output-apk/*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          draft: true
